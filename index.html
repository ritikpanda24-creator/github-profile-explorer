
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>GitHub Profile Explorer</h1>
        <p>Discover GitHub developers and their repositories</p>
    </header>

    <main class="container">

        <section class="search-section">
            <input
                type="text"
                id="username"
                placeholder="Enter GitHub username or profile URL..."
            >
            <button id="searchBtn">Search</button>
        </section>

        <p id="message"></p>

        <section id="profileContainer"></section>

        <section id="repoSection" class="hidden">
            <h2>Public Repositories</h2>
            <div id="reposContainer" class="repos-grid"></div>
        </section>

        <section class="history-section">
            <h3>Recently Searched</h3>
            <div id="historyContainer"></div>
        </section>

    </main>

    <footer>
        <p>GitHub Profile Explorer | HTML, CSS & JavaScript</p>
    </footer>

</body>
</html>
